# Replay the recorded specs, and repair them when they go red.
#
# The happy path never records. Recording needs a model, takes minutes and is
# not deterministic — none of which belongs on a pull request. Replay is plain
# Playwright: same input, same result, no API calls. That split is the whole
# point of the project, so the CI file is where it has to be visible.
#
# A red replay is the only moment the model comes back. Replay runs with
# `continue-on-error`, so a failure does not end the job: it writes the list of
# red specs and hands off to `record`, which — with no target — reads that list
# and repairs only those specs in Mode B. The verify agent follows the existing
# spec/trace, takes over at the first step that no longer holds, re-records from
# there, and the deterministic renderer + gates confirm it. A repair is not the
# agent's word — only a spec that passes the replay gate counts as repaired.
#
# So the job's final colour carries the verdict:
#   - replay green                          -> green
#   - replay red, record repaired + pushed  -> green  (only a locator drifted)
#   - replay red, record could not repair   -> red    (the business logic broke)
#
# The repaired spec is committed with `[skip ci]`, so pushing it does not kick
# off the whole workflow again — only the red specs were re-run, and that
# already happened inside `record`.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The repair step pushes the repaired spec back to the branch.
permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Only the browser we actually replay on. Installing all three costs
      # download time and disk for nothing.
      - run: npx playwright install chromium --with-deps

      # `status` first: it fails when a feature has no recorded spec. Without
      # that check such a feature is simply absent from the run, and an absent
      # test is indistinguishable from a passing one.
      - name: Check every feature has been recorded
        run: npm run status

      # The gates have their own counterexamples. A gate that has never rejected
      # anything is indistinguishable from no gate at all.
      - name: Test the gates
        run: npm test

      # Recording applies the gates once, when a spec is made. A rule added
      # afterwards would never revisit what is already committed.
      - name: Check recorded specs against the current rules
        run: npm run check

      # continue-on-error: a red replay is not the verdict — it is the signal to
      # repair. The job stays red only if the repair fails, so a green job means
      # the business logic held (or was repaired), never "the replay passed".
      - name: Replay
        id: replay
        continue-on-error: true
        run: npm run replay
        env:
          # Point at the environment under test. A spec recorded against one
          # data set proves nothing about another, so this must match whatever
          # the recording was made against.
          BASE_URL: ${{ vars.BASE_URL }}

      # ---- everything below runs only when the replay went red ----

      - name: Install the Claude CLI
        if: steps.replay.outcome == 'failure'
        run: npm install --global @anthropic-ai/claude-code

      # The committed tree has no agents or MCP config — they are OS-specific
      # and gitignored. Regenerate them here so they point at the Linux server.
      - name: Set up the Playwright agents
        if: steps.replay.outcome == 'failure'
        run: npm run setup:agents

      # `record` with no target reads the red-spec list the replay just wrote and
      # repairs only those specs in Mode B — the verify agent follows each red
      # spec/trace and takes over where it stops holding, so the green specs are
      # not touched. Specs the page changed beyond re-location become diagnosis
      # reports under reports/.
      - name: Repair the red specs
        id: repair
        if: steps.replay.outcome == 'failure'
        run: npm run record
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # `[skip ci]`: the repair already re-ran the red specs to green. Pushing
      # the fix must not re-trigger the whole workflow for a 2-hour replay of
      # specs that already passed.
      # Stage only what a repair is allowed to touch — the specs and traces it
      # rewrites and the diagnoses it writes. `git add -A` was wider than the
      # truth: the setup step above generates files of its own, and a run that
      # repaired nothing still swept them into a commit saying it had repaired a
      # locator.
      - name: Push the repaired spec
        if: steps.repair.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A run
          if [ -d reports ]; then git add -A reports; fi
          git diff --cached --quiet || git commit -m "test: repair locators that went red in CI [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # A diagnosis report is the failure exit of a verify run (a first recording
      # or a Mode B repair). Upload it so a human can see why the business logic
      # could not be verified and whether the fault is frontend or backend.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: diagnosis-reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
